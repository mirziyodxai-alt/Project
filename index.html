<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Lake That Killed Without a Sound</title>
  <style>
    @font-face { font-family: "Nyos Serif"; font-weight: 500; font-style: normal; src: url(assets/fonts/cormorant-garamond-latin-500-normal.woff2) format("woff2"); }
    @font-face { font-family: "Nyos Serif"; font-weight: 500; font-style: italic; src: url(assets/fonts/cormorant-garamond-latin-500-italic.woff2) format("woff2"); }
    @font-face { font-family: "Nyos Serif"; font-weight: 600; font-style: normal; src: url(assets/fonts/cormorant-garamond-latin-600-normal.woff2) format("woff2"); }
    @font-face { font-family: "Nyos Sans"; font-weight: 400; src: url(assets/fonts/inter-latin-400-normal.woff2) format("woff2"); }
    @font-face { font-family: "Nyos Sans"; font-weight: 500; src: url(assets/fonts/inter-latin-500-normal.woff2) format("woff2"); }
    :root { --bg: #07090d; --fg: #e9e4d8; --muted: #8a8f99; --accent: #6fb3c0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Nyos Sans", system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
    .stage { position: relative; width: min(100%, calc((100vh - 110px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(0,0,0,.35); transition: opacity .3s; }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay button { font: 500 16px "Nyos Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--fg); background: rgba(10,14,20,.6); border: 1px solid rgba(233,228,216,.35); padding: 14px 26px; border-radius: 999px; cursor: pointer; }
    .controls { width: min(100%, calc((100vh - 110px) * 16 / 9)); display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
    .controls button { background: none; border: 1px solid #2a2f38; color: var(--fg); border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; min-width: 64px; }
    .controls button:hover { border-color: #4a5260; }
    input[type=range] { flex: 1; accent-color: var(--accent); }
    .time { font-variant-numeric: tabular-nums; min-width: 88px; text-align: right; }
    label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    body.export { padding: 0; display: block; }
    body.export .controls, body.export .overlay { display: none; }
    body.export .stage { width: 1920px; height: 1080px; box-shadow: none; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="film" width="1920" height="1080"></canvas>
    <div class="overlay" id="overlay"><button id="start" type="button">▶ Play film (with sound)</button></div>
  </div>
  <div class="controls">
    <button id="play" type="button">Play</button>
    <input id="seek" type="range" min="0" max="60" step="0.01" value="0" aria-label="Seek">
    <span class="time" id="time">0:00.0 / 1:00</span>
    <label><input type="checkbox" id="subs" checked> Subtitles</label>
    <label><input type="checkbox" id="sound" checked> Sound</label>
  </div>

  <script src="src/util.js"></script>
  <script src="src/env.js"></script>
  <script src="src/draw.js"></script>
  <script src="src/valley.js"></script>
  <script src="src/scenes.js"></script>
  <script src="src/cutaway.js"></script>
  <script src="src/post.js"></script>
  <script src="src/timeline.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
